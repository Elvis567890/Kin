name: Auto-Generate AFRINODE System

on:
  workflow_dispatch: # Allows you to click a button to run it

permissions:
  contents: write # Allows the script to create files and push them to your repo
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🪄 WRITE ALL CODE FILES
        run: |
          # Create Directories
          mkdir -p src/content public/admin
          
          # 1. package.json (Fixes the previous error)
          cat << 'EOF' > package.json
          {
            "name": "afrinode-website",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "framer-motion": "^11.1.7",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.1",
              "vite": "^5.2.0"
            }
          }
          EOF

          # 2. vite.config.js
          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({
            plugins: [react()],
            base: './', 
          })
          EOF

          # 3. index.html
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>AFRINODE | Connect. Intelligent. Transform Africa.</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          # 4. src/main.jsx
          cat << 'EOF' > src/main.jsx
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'
          import './index.css'
          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode><App /></React.StrictMode>,
          )
          EOF

          # 5. src/index.css (Animations)
          cat << 'EOF' > src/index.css
          :root { --navy: #0A192F; --gold: #D4AF37; --green: #00A86B; }
          body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--navy); color: white; overflow-x: hidden; }
          @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
          @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); } 70% { box-shadow: 0 0 10px 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }
          @keyframes drawLine { to { stroke-dashoffset: 0; } }
          .animate-float { animation: float 4s ease-in-out infinite; }
          .animate-node { animation: pulse-gold 2s infinite; }
          .tech-card { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
          .tech-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.1); }
          EOF

          # 6. src/App.jsx (Main Website)
          cat << 'EOF' > src/App.jsx
          import React, { useState } from 'react';
          import { motion } from 'framer-motion';
          import settingsData from './content/settings.json';
          import appsData from './content/apps.json';

          const AfrinodeLogo = () => (
            <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }} className="animate-float">
              <svg width="50" height="50" viewBox="0 0 100 100">
                <circle cx="20" cy="30" r="4" fill="#D4AF37" className="animate-node" />
                <circle cx="40" cy="15" r="4" fill="#D4AF37" className="animate-node" style={{ animationDelay: '0.5s' }} />
                <circle cx="30" cy="50" r="4" fill="#D4AF37" className="animate-node" style={{ animationDelay: '1s' }} />
                <path d="M20 30 L40 15 L50 40" fill="none" stroke="#D4AF37" strokeWidth="2" strokeDasharray="100" strokeDashoffset="100" style={{ animation: 'drawLine 2s ease-out forwards' }} />
                <path d="M20 30 L30 50 L60 50" fill="none" stroke="#D4AF37" strokeWidth="2" strokeDasharray="100" strokeDashoffset="100" style={{ animation: 'drawLine 2s ease-out 0.5s forwards' }} />
                <path d="M50 40 L70 90 L50 90 Z" fill="#0A192F" stroke="#D4AF37" strokeWidth="2" />
                <path d="M70 90 L90 90 L60 20 Z" fill="#D4AF37" opacity="0.8" />
              </svg>
              <div>
                <h1 style={{ margin: 0, fontSize: '24px', letterSpacing: '2px' }}><span style={{ color: 'white' }}>AFRI</span><span style={{ color: '#D4AF37' }}>NODE</span></h1>
                <p style={{ margin: 0, fontSize: '10px', color: '#00A86B', letterSpacing: '2px', fontWeight: 'bold' }}>CONNECT. INTELLIGENT. TRANSFORM AFRICA.</p>
              </div>
            </div>
          );

          export default function App() {
            const [settings] = useState(settingsData);
            const [apps] = useState(appsData.apps);
            return (
              <div>
                <nav style={{ display: 'flex', justifyContent: 'space-between', padding: '20px 50px', backgroundColor: 'rgba(10, 25, 47, 0.95)', position: 'fixed', width: '100%', top: 0, boxSizing: 'border-box', zIndex: 100, borderBottom: '1px solid rgba(212, 175, 55, 0.2)' }}>
                  <AfrinodeLogo />
                  <div style={{ display: 'flex', gap: '30px', alignItems: 'center' }}>
                    <a href="#tech" style={{ color: 'white', textDecoration: 'none', fontWeight: 'bold' }}>Our Tech</a>
                    <a href="/admin/" style={{ color: '#0A192F', background: '#D4AF37', padding: '10px 20px', borderRadius: '5px', textDecoration: 'none', fontWeight: 'bold' }}>Admin Login</a>
                  </div>
                </nav>
                <header style={{ height: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center', padding: '0 20px' }}>
                  <motion.h1 initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1 }} style={{ fontSize: '4rem', marginBottom: '20px', fontWeight: '900', lineHeight: '1.2' }}>
                    {settings.title.split('AFRINODE')[0]}<span style={{ color: '#D4AF37' }}>AFRINODE</span>
                  </motion.h1>
                  <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.5, duration: 1 }} style={{ fontSize: '1.2rem', color: '#a0aab8', maxWidth: '700px', marginBottom: '40px' }}>
                    {settings.subtitle}
                  </motion.p>
                  <motion.a href="#tech" whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} style={{ padding: '15px 40px', background: '#D4AF37', color: '#0A192F', textDecoration: 'none', fontWeight: 'bold', borderRadius: '50px', fontSize: '1.1rem', boxShadow: '0 0 20px rgba(212, 175, 55, 0.4)' }}>Explore Our Tech</motion.a>
                </header>
                <section id="tech" style={{ padding: '100px 50px', backgroundColor: '#060e1a', minHeight: '100vh' }}>
                  <h2 style={{ textAlign: 'center', color: '#D4AF37', fontSize: '2.5rem', marginBottom: '50px' }}>Our Technologies</h2>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '30px', maxWidth: '1200px', margin: '0 auto' }}>
                    {apps.map((app, i) => (
                      <motion.div key={i} initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} transition={{ delay: i * 0.1, duration: 0.5 }} viewport={{ once: true }} className="tech-card">
                        {app.image && <img src={app.image} alt={app.title} style={{ width: '100%', height: '150px', objectFit: 'cover', borderRadius: '10px', marginBottom: '20px' }} />}
                        <h3 style={{ margin: '0 0 10px 0', fontSize: '1.5rem' }}>{app.title}</h3>
                        <p style={{ color: '#a0aab8', lineHeight: '1.6' }}>{app.desc}</p>
                      </motion.div>
                    ))}
                  </div>
                </section>
              </div>
            );
          }
          EOF

          # 7 & 8. Content Data
          cat << 'EOF' > src/content/settings.json
          { "title": "Welcome to AFRINODE", "subtitle": "We connect intelligent technologies, build scalable apps, and transform the African tech ecosystem." }
          EOF
          
          cat << 'EOF' > src/content/apps.json
          { "apps": [ { "title": "AI Integration", "desc": "Deploying intelligent machine learning models to solve complex African market challenges.", "image": "" }, { "title": "Mobile Apps", "desc": "Building fast, reliable, and beautiful mobile applications for the next billion users.", "image": "" }, { "title": "Cloud Infrastructure", "desc": "Scalable and secure server solutions designed to handle heavy data and traffic loads.", "image": "" } ] }
          EOF

          # 9 & 10. Admin Panel Files
          cat << 'EOF' > public/admin/index.html
          <!doctype html>
          <html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>AFRINODE Admin</title></head><body><script src="https://unpkg.com/decap-cms@^3.1.10/dist/decap-cms.js"></script></body></html>
          EOF

          cat << 'EOF' > public/admin/config.yml
          backend:
            name: github
            repo: REPO_PLACEHOLDER
            branch: main
          media_folder: "public/images/uploads"
          public_folder: "/images/uploads"
          collections:
            - name: "apps"
              label: "Manage Apps & Tech"
              files:
                - file: "src/content/apps.json"
                  label: "Apps List"
                  name: "apps_list"
                  fields:
                    - label: "Apps"
                      name: "apps"
                      widget: "list"
                      fields:
                        - {label: "App Name", name: "title", widget: "string"}
                        - {label: "Description", name: "desc", widget: "text"}
                        - {label: "App Image", name: "image", widget: "image", required: false}
            - name: "settings"
              label: "Website Settings"
              files:
                - file: "src/content/settings.json"
                  label: "Welcome Message"
                  name: "welcome_settings"
                  fields:
                    - {label: "Hero Title", name: "title", widget: "string"}
                    - {label: "Hero Subtitle", name: "subtitle", widget: "text"}
          EOF

          # Automatically inject your GitHub Repo Name into the Admin Config
          sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" public/admin/config.yml

      - name: 🚀 UPLOAD CODE TO REPOSITORY
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-generated AFRINODE full system [skip ci]" || echo "No changes to commit"
          git push

      - name: 🛠️ RERUN/REBUILD - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 RERUN/REBUILD - Install Dependencies
        run: npm install

      - name: 🏗️ RERUN/REBUILD - Build Website
        run: npm run build

      - name: 🌐 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
